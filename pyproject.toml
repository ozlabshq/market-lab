[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ozlabs-market-lab"
version = "0.1.0"
description = "OzLabs research-first market intelligence and mock trading lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "yfinance>=0.2.40",
]

[project.scripts]
market-lab-webapp = "market_lab.webapp:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools]
packages = ["market_lab"]

[tool.pytest.ini_options]
testpaths = ["tests/market_lab"]
pythonpath = ["."]
